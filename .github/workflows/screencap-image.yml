# Builds the Screencap web image (this fork's apps/web) and publishes it to
# ghcr.io/ques123/screencap-web. Upstream's CI workflows were removed from this fork.
name: Screencap image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: screencap-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build-time env
        run: |
          echo "WEB_URL=http://localhost:3000" > .env
          echo "NEXT_PUBLIC_DOCKER_BUILD=true" >> .env

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/ques123/screencap-web:latest
            ghcr.io/ques123/screencap-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ques123/screencap-web
            org.opencontainers.image.description=Screencap web (self-hosted fork of Cap)
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
